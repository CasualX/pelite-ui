name: Deploy PE Inspector

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Vue-Script
        run: cargo install --git https://github.com/CasualX/Vue-Script vue-script

      # Skip postinstall so the committed dist/deps package stays intact.
      - name: Install dependencies and check vendored app
        run: |
          npm ci --ignore-scripts
          npm run check

      - name: Build app
        run: |
          npm run build
          sed -i 's|src="deps/vue.global.js"|src="deps/vue.global.prod.js"|' dist/index.html
          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload app
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
